name: Build and deploy million-puzzle trainer

on:
  workflow_dispatch:
    inputs:
      puzzle_count:
        description: Number of Lichess puzzles to publish
        required: true
        default: "1000000"
      chunk_size:
        description: Puzzles per compressed file
        required: true
        default: "10000"
      min_popularity:
        description: Minimum Lichess popularity (-100 to 100)
        required: true
        default: "0"
      min_plays:
        description: Minimum recorded attempts per puzzle
        required: true
        default: "20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  STOCKFISH_TAG: v18.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Cache pinned Stockfish 18 browser engine
        uses: actions/cache@v4
        with:
          path: _engine
          key: stockfish-js-${{ env.STOCKFISH_TAG }}-full-single-v2

      - name: Fetch pinned Stockfish 18 engine, license, and source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_stockfish.py --output _engine

      - name: Build one-million-puzzle site
        run: |
          python scripts/build_pages.py \
            --site-dir _site \
            --limit "${{ inputs.puzzle_count }}" \
            --chunk-size "${{ inputs.chunk_size }}" \
            --min-popularity "${{ inputs.min_popularity }}" \
            --min-plays "${{ inputs.min_plays }}" \
            --min-solver-moves 1 \
            --max-solver-moves 6 \
            --include-mate-in-one

      - name: Apply objective-aware correctness layer
        run: python scripts/apply_correctness_foundation.py --site-dir _site

      - name: Apply Stockfish 18 engine layer
        run: |
          python scripts/apply_stockfish_engine.py \
            --site-dir _site \
            --engine-dir _engine

      - name: Apply Play vs Stockfish
        run: python scripts/apply_play_stockfish.py --site-dir _site

      - name: Apply post-game Stockfish analysis
        run: python scripts/apply_postgame_analysis.py --site-dir _site

      - name: Verify generated site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = Path("_site")
          manifest = json.loads((site / "puzzles/manifest.json").read_text())
          expected = int("${{ inputs.puzzle_count }}")

          assert manifest["count"] == expected, (manifest["count"], expected)
          assert sum(chunk["count"] for chunk in manifest["chunks"]) == expected
          assert manifest["quality"]["mateInOneExcluded"] is False
          assert manifest["quality"]["uniqueFirstMove"] is False

          required = {
              "index": site / "index.html",
              "correctness": site / "js/correctness-foundation.js",
              "controller": site / "js/stockfish-controller.js",
              "engine_layer": site / "js/stockfish-engine-layer.js",
              "play_layer": site / "js/play-stockfish.js",
              "analysis_layer": site / "js/postgame-analysis.js",
              "layout_layer": site / "js/app-layout.js",
              "engine_js": site / "engine/stockfish-18-single.js",
              "engine_wasm": site / "engine/stockfish-18-single.wasm",
              "license": site / "engine/Copying.txt",
              "source_notice": site / "engine/SOURCE.txt",
              "source_archive": site / "engine/source/stockfish.js-v18.0.0-source.zip",
              "checksums": site / "engine/SHA256SUMS.json",
              "release_record": site / "engine/RELEASE.json",
          }

          for label, path in required.items():
              assert path.is_file() and path.stat().st_size > 0, (label, path)

          assert required["engine_js"].stat().st_size > 10_000
          assert required["engine_wasm"].stat().st_size > 50_000_000
          assert required["license"].stat().st_size > 10_000
          assert required["source_archive"].stat().st_size > 100_000

          html = required["index"].read_text()
          assert 'js/correctness-foundation.js' in html
          assert 'js/stockfish-controller.js' in html
          assert 'js/stockfish-engine-layer.js' in html
          assert 'js/play-stockfish.js' in html
          assert 'js/postgame-analysis.js' in html
          assert 'js/app-layout.js' in html
          assert html.index('js/stockfish-controller.js') < html.index('js/stockfish-engine-layer.js')
          assert html.index('js/stockfish-engine-layer.js') < html.index('js/play-stockfish.js')
          assert html.index('js/play-stockfish.js') < html.index('js/app-layout.js')
          assert html.index('js/app-layout.js') < html.index('js/postgame-analysis.js')
          assert 'objective-aware answers' in html
          assert 'Mate-in-one records are excluded' not in html

          correctness = required["correctness"].read_text()
          assert "correctness-foundation-1.2.2" in correctness

          controller = required["controller"].read_text()
          layer = required["engine_layer"].read_text()
          assert "stockfish-controller-2.0" in controller
          assert "stockfish-engine-layer-2.0" in layer
          assert "new StockfishController" in layer
          assert "The engine binary stays lazy" in layer

          play = required["play_layer"].read_text()
          assert "play-vs-stockfish-2.1.4" in play
          assert "analysisSnapshot: 'read-only-completed-game-v1'" in play
          assert "Play Stockfish 18" in play
          assert "Training" in play and "Tournament" in play
          assert "Offer draw" in play
          assert "Export PGN" in play

          review = required["analysis_layer"].read_text()
          assert "postgame-analysis-2.2" in review
          assert "Retry this position" in review
          assert "Turn into puzzle" in review
          assert "searchMoves: [position.move.uci]" in review
          assert "canQueuePremove" in play
          assert "tryExecutePremove" in play
          assert "single-queued-legal-after-stockfish" in play

          layout = required["layout_layer"].read_text()
          assert "comfortable-layout-2.1.2" in layout
          assert "max-width:1180px" in layout
          assert "460px" in layout
          assert "mobileSingleColumn: true" in layout

          release = json.loads(required["release_record"].read_text())
          assert release["tag"] == "v18.0.0"
          assert release["upstreamOfficialStockfishCommit"] == "cb3d4ee"

          assert all(
              (site / "puzzles" / chunk["file"]).is_file()
              for chunk in manifest["chunks"]
          )

          print(
              f"Verified {manifest['count']:,} puzzles, Build 1.2.2 correctness, "
              f"pinned Stockfish 18 Build 2.0, and Play Build 2.1."
          )
          PY

          du -sh _site
          du -sh _site/engine

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
