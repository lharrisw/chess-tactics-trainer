name: Build and deploy million-puzzle trainer

on:
  workflow_dispatch:
    inputs:
      puzzle_count:
        description: Number of Lichess puzzles to publish
        required: true
        default: "1000000"
      chunk_size:
        description: Puzzles per compressed file
        required: true
        default: "10000"
      min_popularity:
        description: Minimum Lichess popularity (-100 to 100)
        required: true
        default: "0"
      min_plays:
        description: Minimum recorded attempts per puzzle
        required: true
        default: "20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Build one-million-puzzle site
        run: |
          python scripts/build_pages.py \
            --site-dir _site \
            --limit "${{ inputs.puzzle_count }}" \
            --chunk-size "${{ inputs.chunk_size }}" \
            --min-popularity "${{ inputs.min_popularity }}" \
            --min-plays "${{ inputs.min_plays }}" \
            --min-solver-moves 1 \
            --max-solver-moves 6

      - name: Verify generated site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/puzzles/manifest.json").read_text())
          expected = int("${{ inputs.puzzle_count }}")
          assert manifest["count"] == expected, (manifest["count"], expected)
          assert sum(chunk["count"] for chunk in manifest["chunks"]) == expected
          assert Path("_site/index.html").is_file()
          assert all((Path("_site/puzzles") / chunk["file"]).is_file() for chunk in manifest["chunks"])
          print(f"Verified {manifest['count']:,} puzzles in {len(manifest['chunks'])} chunks")
          PY
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
