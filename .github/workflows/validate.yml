name: Validate trainer source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/build_pages.py
          python -m py_compile scripts/apply_correctness_foundation.py

      - name: Check correctness addon syntax and Build 1.2.1 UX markers
        run: |
          node --check js/correctness-foundation.js
          python - <<'PY'
          from pathlib import Path
          addon = Path("js/correctness-foundation.js").read_text()
          required = [
              "correctness-foundation-1.2.1",
              "introFen",
              "introMove",
              "Watch the opponent's move.",
              "ct-try-again",
              "Your move is left on the board",
              "persistentWrongMoveFeedback",
              "ct-replay-back",
              "ct-replay-forward",
              "revealedOnlyMoveReplay",
              "Hint 1/2",
              "Hint 2/2",
              "progressiveHintsPerMove",
              "originalHintClickHandler",
              "removeEventListener('click', originalHintClickHandler)",
              "addEventListener('click', doHint)",
              "progressiveHintHandlersRebound",
          ]
          for marker in required:
              assert marker in addon, marker
          print("Build 1.2.1 replacement hint/solution handlers, replay, and retry UX are present.")
          PY

      - name: Build existing sample puzzle site
        run: |
          python scripts/build_pages.py \
            --source tests/fixtures/lichess_sample.csv \
            --site-dir _site-test \
            --limit 3 \
            --chunk-size 2 \
            --min-popularity -100 \
            --min-plays 0 \
            --include-mate-in-one
          python scripts/apply_correctness_foundation.py --site-dir _site-test

      - name: Build mate-in-one regression fixture
        run: |
          python scripts/build_pages.py \
            --source tests/fixtures/lichess_matein1_sample.csv \
            --site-dir _site-mate1 \
            --limit 1 \
            --chunk-size 1 \
            --min-popularity -100 \
            --min-plays 0 \
            --include-mate-in-one
          python scripts/apply_correctness_foundation.py --site-dir _site-mate1

      - name: Validate manifests, injection, and JavaScript syntax
        run: |
          python - <<'PY'
          import gzip, json, re
          from pathlib import Path

          for site_name, expected in [("_site-test", 3), ("_site-mate1", 1)]:
              site = Path(site_name)
              root = site / "puzzles"
              manifest = json.loads((root / "manifest.json").read_text())

              assert manifest["count"] == expected
              assert sum(c["count"] for c in manifest["chunks"]) == expected
              assert manifest["quality"]["mateInOneExcluded"] is False
              assert manifest["quality"]["uniqueFirstMove"] is False

              for chunk in manifest["chunks"]:
                  with gzip.open(root / chunk["file"], "rt", encoding="utf-8") as handle:
                      payload = json.load(handle)
                  assert payload["v"] == 1 and payload["p"]

              html = (site / "index.html").read_text()
              assert 'js/correctness-foundation.js' in html
              assert 'objective-aware answers' in html
              assert (site / "js/correctness-foundation.js").is_file()

          # The dedicated regression fixture must actually contain mateIn1.
          mate_root = Path("_site-mate1/puzzles")
          mate_manifest = json.loads((mate_root / "manifest.json").read_text())
          with gzip.open(mate_root / mate_manifest["chunks"][0]["file"], "rt", encoding="utf-8") as handle:
              record = json.load(handle)["p"][0]
          assert "mateIn1" in record[5].split()

          # Keep the current application's inline JavaScript syntax check.
          html = Path("index.html").read_text()
          script = re.search(r"<script>(.*)</script>", html, re.S).group(1)
          Path("app-check.js").write_text(script)
          PY
          node --check app-check.js
