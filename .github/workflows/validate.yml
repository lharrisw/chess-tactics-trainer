name: Validate trainer source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/build_pages.py
          python -m py_compile scripts/apply_correctness_foundation.py
          python -m py_compile scripts/fetch_stockfish.py
          python -m py_compile scripts/apply_stockfish_engine.py
          python -m py_compile scripts/apply_play_stockfish.py
          python -m py_compile scripts/apply_postgame_analysis.py

      - name: Check Build 1.2.2 correctness and puzzle UX
        run: |
          node --check js/correctness-foundation.js

          python - <<'PY'
          from pathlib import Path

          addon = Path("js/correctness-foundation.js").read_text()
          required = [
              "correctness-foundation-1.2.2",
              "introFen",
              "introMove",
              "Watch the opponent's move.",
              "ct-try-again",
              "Your move is left on the board",
              "persistentWrongMoveFeedback",
              "ct-replay-back",
              "ct-replay-forward",
              "revealedOnlyMoveReplay",
              "Hint 1/2",
              "Hint 2/2",
              "progressiveHintsPerMove",
              "originalHintClickHandler",
              "removeEventListener('click', originalHintClickHandler)",
              "addEventListener('click', doHint)",
              "progressiveHintHandlersRebound",
              "initialSetupReplayImmediatelyAvailable",
              "Refresh once the intro has finished",
          ]

          for marker in required:
              assert marker in addon, marker

          print("Build 1.2.2 regression gate passed.")
          PY

      - name: Check Build 2.0 Stockfish source
        run: |
          node --check js/stockfish-controller.js
          node --check js/stockfish-engine-layer.js
          node tests/test-stockfish-controller.js

          python - <<'PY'
          from pathlib import Path

          controller = Path("js/stockfish-controller.js").read_text()
          layer = Path("js/stockfish-engine-layer.js").read_text()
          fetcher = Path("scripts/fetch_stockfish.py").read_text()

          required_controller = [
              "stockfish-controller-2.0",
              "stockfish-18-single.js",
              "UCI_LimitStrength",
              "UCI_Elo",
              "Skill Level",
              "makeGoCommand",
              "class StockfishController",
          ]

          required_layer = [
              "stockfish-engine-layer-2.0",
              "global.ChessEngine = api",
              "analyzeFen",
              "bestMove",
              "newGame",
              "selfTest",
              "The engine binary stays lazy",
              "Local Stockfish engine",
          ]

          required_fetcher = [
              'TAG = "v18.0.0"',
              'UPSTREAM_COMMIT = "cb3d4ee"',
              '"stockfish-18-single.js"',
              '"stockfish-18-single.wasm"',
              "Copying.txt",
              "source.zip",
          ]

          for marker in required_controller:
              assert marker in controller, marker
          for marker in required_layer:
              assert marker in layer, marker
          for marker in required_fetcher:
              assert marker in fetcher, marker

          print("Build 2.0 Stockfish source regression gate passed.")
          PY

      - name: Check Build 2.1.4 Play + premove source
        run: |
          node --check js/play-stockfish.js
          node --check js/app-layout.js
          node tests/test-play-stockfish.js

          python - <<'PY'
          from pathlib import Path

          play = Path("js/play-stockfish.js").read_text()
          layout = Path("js/app-layout.js").read_text()
          apply_play = Path("scripts/apply_play_stockfish.py").read_text()

          required_play = [
              "play-vs-stockfish-2.1.4",
              "Play Stockfish 18",
              "Training",
              "Tournament",
              "1+0",
              "3+2",
              "10+5",
              "30+20",
              "Offer draw",
              "Take back",
              "Export PGN",
              "Auto-queen",
              "Drag pieces",
              "Piece animation",
              "Threefold repetition",
              "50-move rule",
              "Insufficient material",
              "global.ChessEngine.analyzeFen",
              "canQueuePremove",
              "Premove queued:",
              "tryExecutePremove",
              "single-queued-legal-after-stockfish",
              "analysisSnapshot: 'read-only-completed-game-v1'",
              "snapshot: gameSnapshot",
              "ct-premove-from",
              "ct-premove-to",
              "Premove canceled — it is no longer legal",
          ]

          required_apply = [
              "SCRIPT_TAGS",
              "stockfish-engine-layer.js",
              "play-stockfish.js",
              "app-layout.js",
          ]

          required_layout = [
              "comfortable-layout-2.1.2",
              "max-width:1180px",
              "460px",
              "560px",
              "flex-wrap:nowrap",
              "min-width:max-content",
              "@media (max-width:1080px)",
              "@media (max-width:620px)",
              "grid-template-columns:1fr !important",
              "mobileSingleColumn: true",
          ]

          for marker in required_play:
              assert marker in play, marker

          for marker in required_layout:
              assert marker in layout, marker

          for marker in required_apply:
              assert marker in apply_play, marker

          print("Build 2.1.4 Play premove + responsive layout regression gate passed.")
          PY

      - name: Check Build 2.2 post-game analysis source
        run: |
          node --check js/postgame-analysis.js
          node tests/test-postgame-analysis.js

          python - <<'PY'
          from pathlib import Path

          review = Path("js/postgame-analysis.js").read_text()
          apply_review = Path("scripts/apply_postgame_analysis.py").read_text()

          required_review = [
              "postgame-analysis-2.2",
              "Full-strength Stockfish 18",
              "searchMoves: [position.move.uci]",
              "estimated win-chance loss",
              "Missed mate",
              "Missed win",
              "Blunder",
              "bestSecondGapCp",
              "Retry this position",
              "Turn into puzzle",
              "Personal mistake notebook",
              "writePuzzleBatch",
              "refreshDBStats",
              "global.ChessEngine.setStrength({ mode: 'full' })",
          ]

          required_apply = [
              "SCRIPT_TAG = '<script src=\"js/postgame-analysis.js\"></script>'",
              "js/stockfish-engine-layer.js",
              "js/play-stockfish.js",
              "js/app-layout.js",
          ]

          for marker in required_review:
              assert marker in review, marker

          for marker in required_apply:
              assert marker in apply_review, marker

          print("Build 2.2 post-game analysis regression gate passed.")
          PY

      - name: Build existing sample puzzle site
        run: |
          python scripts/build_pages.py \
            --source tests/fixtures/lichess_sample.csv \
            --site-dir _site-test \
            --limit 3 \
            --chunk-size 2 \
            --min-popularity -100 \
            --min-plays 0 \
            --include-mate-in-one

          python scripts/apply_correctness_foundation.py --site-dir _site-test

      - name: Build mate-in-one regression fixture
        run: |
          python scripts/build_pages.py \
            --source tests/fixtures/lichess_matein1_sample.csv \
            --site-dir _site-mate1 \
            --limit 1 \
            --chunk-size 1 \
            --min-popularity -100 \
            --min-plays 0 \
            --include-mate-in-one

          python scripts/apply_correctness_foundation.py --site-dir _site-mate1

      - name: Create tiny Stockfish deployment stub for static integration test
        run: |
          mkdir -p _engine-test/source

          printf 'self.onmessage=function(){};\n' > _engine-test/stockfish-18-single.js
          printf 'wasm-stub\n' > _engine-test/stockfish-18-single.wasm
          printf 'GPL test stub\n' > _engine-test/Copying.txt
          printf 'Stockfish test source\n' > _engine-test/SOURCE.txt
          printf 'source-stub\n' > _engine-test/source/stockfish.js-v18.0.0-source.zip

          python scripts/apply_stockfish_engine.py \
            --site-dir _site-test \
            --engine-dir _engine-test

          python scripts/apply_play_stockfish.py --site-dir _site-test
          python scripts/apply_postgame_analysis.py --site-dir _site-test

      - name: Validate manifests and generated static integration
        run: |
          python - <<'PY'
          import gzip
          import json
          import re
          from pathlib import Path

          for site_name, expected in [("_site-test", 3), ("_site-mate1", 1)]:
              site = Path(site_name)
              root = site / "puzzles"
              manifest = json.loads((root / "manifest.json").read_text())

              assert manifest["count"] == expected
              assert sum(c["count"] for c in manifest["chunks"]) == expected
              assert manifest["quality"]["mateInOneExcluded"] is False
              assert manifest["quality"]["uniqueFirstMove"] is False

              for chunk in manifest["chunks"]:
                  with gzip.open(root / chunk["file"], "rt", encoding="utf-8") as handle:
                      payload = json.load(handle)
                  assert payload["v"] == 1 and payload["p"]

              html = (site / "index.html").read_text()
              assert 'js/correctness-foundation.js' in html
              assert 'objective-aware answers' in html
              assert (site / "js/correctness-foundation.js").is_file()

          # Build 2.0 is applied to the main static fixture.
          site = Path("_site-test")
          html = (site / "index.html").read_text()

          assert 'js/stockfish-controller.js' in html
          assert 'js/stockfish-engine-layer.js' in html
          assert html.index('js/stockfish-controller.js') < html.index('js/stockfish-engine-layer.js')
          assert (site / "js/stockfish-controller.js").is_file()
          assert (site / "js/stockfish-engine-layer.js").is_file()
          assert (site / "js/play-stockfish.js").is_file()
          assert (site / "js/postgame-analysis.js").is_file()
          assert (site / "js/app-layout.js").is_file()
          assert 'js/play-stockfish.js' in html
          assert 'js/postgame-analysis.js' in html
          assert 'js/app-layout.js' in html
          assert html.index('js/stockfish-engine-layer.js') < html.index('js/play-stockfish.js')
          assert html.index('js/play-stockfish.js') < html.index('js/app-layout.js')
          assert html.index('js/app-layout.js') < html.index('js/postgame-analysis.js')
          assert (site / "engine/stockfish-18-single.js").is_file()
          assert (site / "engine/stockfish-18-single.wasm").is_file()
          assert (site / "engine/Copying.txt").is_file()
          assert (site / "engine/source/stockfish.js-v18.0.0-source.zip").is_file()

          # Dedicated mate-in-one fixture must still contain mateIn1.
          mate_root = Path("_site-mate1/puzzles")
          mate_manifest = json.loads((mate_root / "manifest.json").read_text())
          with gzip.open(
              mate_root / mate_manifest["chunks"][0]["file"],
              "rt",
              encoding="utf-8",
          ) as handle:
              record = json.load(handle)["p"][0]

          assert "mateIn1" in record[5].split()

          # Keep checking the base application's inline JavaScript too.
          source_html = Path("index.html").read_text()
          script = re.search(r"<script>(.*)</script>", source_html, re.S).group(1)
          Path("app-check.js").write_text(script)

          print("Generated Build 1.2.2 + Build 2.0 + Build 2.1 + Build 2.2 integration passed.")
          PY

          node --check app-check.js
